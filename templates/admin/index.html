{% extends 'admin/index.html' %}
{% load i18n %}

{% block content %}
<style>
    .dark body .kpi-card {
        background-color: #111827 !important;
        border-color: #1f2937 !important;
    }
    .dark body .kpi-card h3 {
        color: #9ca3af !important;
    }
    .dark body .kpi-card p.metric-num {
        color: white !important;
    }
    .dark body .kpi-card p.footer-text {
        color: #6b7280 !important;
    }

    /* Кольори метрик для темної теми */
    .dark body .kpi-card .text-blue-kpi { color: #60a5fa !important; }
    .dark body .kpi-card .text-green-kpi { color: #4ade80 !important; }
    .dark body .kpi-card .text-red-kpi { color: #f87171 !important; }
</style>

<div class="flex gap-6 mb-8 flex-wrap">
  <div class="kpi-card flex-1 min-w-48 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <h3 class="text-sm font-medium text-gray-500">Всього студентів</h3>
    <p class="metric-num text-3xl font-bold mt-2 text-gray-900 text-blue-kpi">{{ total_students }}</p>
    <p class="footer-text text-xs text-gray-400 mt-1">в системі</p>
  </div>
  <div class="kpi-card flex-1 min-w-48 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <h3 class="text-sm font-medium text-gray-500">Навчаються</h3>
    <p class="metric-num text-3xl font-bold mt-2 text-gray-900 text-green-kpi">{{ studying_count }}</p>
    <p class="footer-text text-xs text-gray-400 mt-1">активних зараз</p>
  </div>
  <div class="kpi-card flex-1 min-w-48 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <h3 class="text-sm font-medium text-gray-500">Боржників</h3>
    <p class="metric-num text-3xl font-bold mt-2 text-gray-900 text-red-kpi">{{ debtors_count }}</p>
    <p class="footer-text text-xs text-gray-400 mt-1">не оплатили</p>
  </div>
  <div class="kpi-card flex-1 min-w-48 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <h3 class="text-sm font-medium text-gray-500">Груп</h3>
    <p class="metric-num text-3xl font-bold mt-2 text-gray-900 text-blue-kpi">{{ groups_count }}</p>
    <p class="footer-text text-xs text-gray-400 mt-1">активних груп</p>
  </div>
</div>

{{ block.super }}
{% endblock %}
