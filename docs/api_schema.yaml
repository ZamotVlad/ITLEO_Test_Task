components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Ім'я користувача
        password:
          type: string
          writeOnly: true
          title: Пароль
        token:
          type: string
          readOnly: true
          title: Токен
      required:
      - password
      - token
      - username
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        teacher:
          type: integer
          nullable: true
        teacher_name:
          type: string
          readOnly: true
        schedule_entries:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
          readOnly: true
      required:
      - id
      - name
      - schedule_entries
      - teacher_name
    NotificationLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        recipient:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/NotificationLogStatusEnum'
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - message
      - recipient
      - sent_at
      - status
      - type
    NotificationLogStatusEnum:
      enum:
      - sent
      - failed
      type: string
      description: |-
        * `sent` - Sent
        * `failed` - Failed
    PaginatedCourseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
